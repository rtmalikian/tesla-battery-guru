[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-battery-guru"
version = "0.1.0"
description = "Free Tesla battery-health estimator: degradation from charge sessions, a habit care score, and 3-day streak alerts, with an OpenAI-compatible coach API — pluggable LLM backend and full offline rules engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "openai-compatible", "llm", "ai", "chat", "ollama", "battery-health", "degradation", "supercharger", "ev", "model-3", "model-y"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]

[project.scripts]
tbguru = "tesla_battery_guru.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-battery-guru"
Issues = "https://github.com/rtmalikian/tesla-battery-guru/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
